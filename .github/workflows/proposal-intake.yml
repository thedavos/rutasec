# Maintainer workflow (DAV-137 Phase D): fetch + enrich a GitHub proposal issue.
# Requires repository secret CURSOR_API_KEY. GITHUB_TOKEN is provided by Actions.
#
# Next step after review: run "Proposal promote" (optionally pass this run id as intake_run_id).
name: Proposal intake

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number (resource proposal)
        required: true
        type: string
      dry_run:
        description: Validate only; do not write proposal file or upload artifact
        required: false
        type: boolean
        default: false

concurrency:
  group: proposal-intake-${{ inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run proposal intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          args="${{ inputs.issue_number }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          npm run proposal:intake -- "$args"

      - name: Upload proposal artifact
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: proposal-issue-${{ inputs.issue_number }}
          path: db/seed/proposals/issue-${{ inputs.issue_number }}.json
          retention-days: 30

      - name: Comment on issue
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          proposal_path="db/seed/proposals/issue-${ISSUE_NUMBER}.json"
          resource_id="$(jq -r '.id' "$proposal_path")"
          title="$(jq -r '.title' "$proposal_path")"
          path_order="$(jq -r '.path_order' "$proposal_path")"

          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          ### Proposal intake complete

          Automated intake finished for this issue. Please review before promoting to the editorial seed.

          | Field | Value |
          | --- | --- |
          | Resource id | \`${resource_id}\` |
          | Title | ${title} |
          | path_order | ${path_order} |
          | Workflow run | ${RUN_URL} |

          **Next steps (maintainers):**
          1. Download \`proposal-issue-${ISSUE_NUMBER}\` from the workflow artifacts (optional if re-running intake in promote).
          2. Run **Proposal promote** with issue \`${ISSUE_NUMBER}\` and intake run id \`${{ github.run_id }}\` to open a seed PR.
          3. After merge: **Proposal seed remote**, then **Proposal close**.
          EOF
          )"
