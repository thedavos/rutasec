# Maintainer workflow (DAV-137 Phase D): load starter + expansion seeds into remote D1 and clear catalog KV.
# Run after merging a proposal seed PR. Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
name: Proposal seed remote

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate SQL only; do not execute against remote D1 or KV
        required: false
        type: boolean
        default: false

concurrency:
  group: proposal-seed-remote
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

jobs:
  seed-remote:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate combined seed SQL
        run: npm run db:seed:sql:all

      - name: Apply seed to remote D1 and clear catalog cache
        if: inputs.dry_run != true
        run: |
          npx wrangler d1 execute rutasec-db --remote --file=db/seed/import.sql
          npm run cache:clear:remote

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "Dry run: generated db/seed/import.sql only."
          wc -l db/seed/import.sql
