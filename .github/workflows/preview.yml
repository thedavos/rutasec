# Same CLOUDFLARE_API_TOKEN requirements as deploy.yml (Workers Scripts + KV + D1).
name: Preview deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Preview action
        required: true
        type: choice
        options:
          - deploy
          - cleanup
      pr_number:
        description: Pull request number
        required: true
        type: string
      ref:
        description: Git ref to deploy (branch, tag, or SHA; defaults to selected ref)
        required: false
        type: string

concurrency:
  group: preview-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-preview:
    if: inputs.target == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: review/pr-${{ inputs.pr_number }}
      url: https://rutasec-pr-${{ inputs.pr_number }}.davidvargas-d45.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview worker
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          preview_worker_name="rutasec-pr-${PR_NUMBER}"
          preview_url="https://${preview_worker_name}.davidvargas-d45.workers.dev"
          auth_secret="${BETTER_AUTH_SECRET:-ci-only-not-for-production-use-32chars!!}"
          printf '%s\n' \
            "BETTER_AUTH_SECRET=${auth_secret}" \
            "BETTER_AUTH_URL=${preview_url}" \
            > .preview.vars
          npx wrangler deploy --config dist/server/wrangler.json --name "$preview_worker_name" --secrets-file .preview.vars

  cleanup-preview:
    if: inputs.target == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler delete "rutasec-pr-${{ inputs.pr_number }}" --force
