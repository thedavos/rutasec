# Requires GitHub secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# Token permissions (Account → Edit): Workers Scripts, Workers KV Storage, D1.
# Missing KV write fails deploy with code 10023 (CATALOG_CACHE binding in wrangler.jsonc).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - production
          - db-schema-remote

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-production:
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rutasec.space/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --config dist/server/wrangler.json

  db-schema-remote:
    if: inputs.target == 'db-schema-remote'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:schema:remote
