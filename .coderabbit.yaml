# CodeRabbit — https://docs.coderabbit.ai/reference/configuration
# Complements GitLab CI (vp check, tests, build). Does not replace the pipeline.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  review_status: true

  path_filters:
    - "!package-lock.json"
    - "!**/dist/**"
    - "!coverage/**"
    - "!playwright-report/**"
    - "!test-results/**"
    - "!.wrangler/**"
    - "!db/seed/import.sql"
    - "!src/routeTree.gen.ts"

  auto_review:
    enabled: true
    drafts: false
    incremental_review: true

  path_instructions:
    - path: "src/modules/**/domain/**"
      instructions: |
        Hexagonal domain layer. Flag violations of:
        - Imports of React, TanStack, D1, Better Auth, Zod, adapters, or routes
        - snake_case in domain entities (use camelCase)
        - Throwing for expected business failures (prefer Result<T, E> from #/shared/domain/result)
        - Port suffix only on domain outbound contracts (not use cases)

    - path: "src/modules/**/application/**"
      instructions: |
        Application use cases. Flag:
        - Direct adapter, getDb(), or SQL usage (depend on domain ports only)
        - Concrete adapter types instead of port interfaces
        - Missing tests when behavior is non-trivial (mock ports, not D1)

    - path: "src/modules/**/adapters/**"
      instructions: |
        Adapters own I/O. Flag:
        - Business rules that belong in domain or application
        - camelCase D1 row fields in schemas (keep snake_case in Zod row schemas)
        - Leaking adapter types into domain/application layers

    - path: "src/app/di/**"
      instructions: |
        Composition root only. Flag getDb() or adapter construction outside *.module.ts files in routes or components.

    - path: "src/modules/**/server/**"
      instructions: |
        TanStack Start server functions (driving adapters). Flag:
        - Missing Sentry.startSpan on createServerFn handler bodies
        - getDb() or D1 calls in server files (use DI modules + use cases)
        - Exporting server modules from #/modules/*/index.ts barrels imported by client UI
        - Personal/auth enforcement via requireAuthenticatedAppUser from #/modules/identity/server, not raw session hacks in library code

    - path: "src/routes/**"
      instructions: |
        File-based routes. Flag:
        - Business logic, SQL, or adapter calls in route components
        - Client-side fetching where loaders + server functions should be used
        - New UI without shadcn primitives from #/shared/presentation/ui/

    - path: "src/modules/identity/**"
      instructions: |
        Identity module (Better Auth + app_users). Flag:
        - Mapping app_users in auth-only UI work (use resolve path on server)
        - Syncing app_users inside getSessionFn (side effects on session read)
        - Re-exporting #/modules/identity/server/* from #/modules/identity index (breaks client build)
        - Social login, orgs, or RBAC beyond MVP

    - path: "src/modules/catalog/**"
      instructions: |
        Public editorial catalog (resources table). Flag:
        - Mixing user_resources / personal state into catalog entities
        - Reads that bypass published scope for public catalog paths

    - path: "db/**"
      instructions: |
        D1 schema and seed. Flag:
        - Breaking separation: resources = editorial, user_resources = personal
        - Non-idempotent seed changes without noting regen of db/seed/import.sql

    - path: "e2e/**"
      instructions: |
        Playwright E2E. Prefer role/text locators. Do not duplicate unit-test business assertions here.

    - path: "**/*.test.ts"
      instructions: |
        Vitest via vite-plus/test (not vitest direct). Use cases must mock domain ports, never getDb() or concrete adapters.

  pre_merge_checks:
    custom_checks:
      - name: MVP scope
        mode: warning
        instructions: |
          Fail if the PR adds features clearly outside v1 ship gate (timeline, full goals dashboard, admin panel, social, scraping) without explicit justification in the MR description.

      - name: Identity client boundary
        mode: warning
        instructions: |
          Fail if src/modules/identity/index.ts exports anything from server/ or imports @tanstack/react-start/server (causes production client build failure).

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
